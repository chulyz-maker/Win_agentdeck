name: 버그 제보
description: 동작하지 않거나 이상한 점을 알려주세요
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 있었나요?
      description: 기대한 동작과 실제 동작
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      placeholder: "1. 업무 홈에서 결재 칸을 누름 2. ..."
  - type: input
    id: env
    attributes:
      label: 환경
      placeholder: "Windows 11 23H2, Python 3.12, D200 / 시뮬레이터"
  - type: textarea
    id: log
    attributes:
      label: charliedeck.log (%LOCALAPPDATA%\CharlieDeck\logs) — 계정 · 회사 정보는 지워 주세요
      render: text
